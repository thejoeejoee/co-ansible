csos:
  hosts:
    csos@orb:

  vars:
    ansible_user: csos

    credentials:
      stream_write:
        - { user: drone, pass: changeme }
        - { user: demo, pass: omed }
      stream_read:
        - { user: vmix, pass: changeme }
      telemetry:
        - { user: admin, pass: changeme }
      gfx:
        - { user: admin, pass: changeme }
      restream:
        targets: []
          # - rtmp://a.rtmp.youtube.com/live2/YOUTUBE_KEY
          # - rtmps://live-api-s.facebook.com:443/rtmp/FACEBOOK_KEY
          # - srt://example.com:9999?streamid=publish:foo
        write:
          - { user: restream, pass: changeme }
      csc:
        - { user: admin, pass: changeme }
      csc_db:
        user: csc
        pass: csc
        name: csc

    web_proxy__domain: csos.orb.local
    web_proxy__disable_tls: true
