csos:
  hosts:
    csos@orb:

  vars:
    ansible_user: csos

    credentials:
      stream_write:
        - { user: drone, pass: changeme }
        - { user: demo, pass: omed }
      stream_read:
        - { user: vmix, pass: changeme }
      telemetry:
        - { user: admin, pass: changeme }
      restream:
        youtube_key: ""
        facebook_key: ""
        write:
          - { user: restream, pass: changeme }

    web_proxy__domain: csos.orb.local
    web_proxy__disable_tls: true

    auth__domain: auth.csos.orb.local
    auth__cookie_domain: .csos.orb.local
    auth__admin_pass: DevAdmin1!
    auth__oauth2_proxy_cookie_secret: dev-cookie-for-orbstack-32bytes!
    auth__google_client_id: placeholder-google-client-id
    auth__google_client_secret: placeholder-google-client-secret
    auth__provision_test_users: true
