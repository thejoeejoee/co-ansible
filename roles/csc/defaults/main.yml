csc__home_dir: /home/csc
csc__source_dir: "{{ playbook_dir }}/../../co-stream-control"

# API is the only container; Caddy fronts it at api.csc.*
csc__api_port: 8100

# admin + gfx are pure static SPAs (ssr:false, no nitro).
# Built once per deploy by a throwaway node:24-slim container; Caddy serves the
# .output/public/ tree directly. See tasks/build_frontends.yml.
csc__admin_dist: "{{ csc__home_dir }}/admin"
csc__gfx_dist: "{{ csc__home_dir }}/gfx"

# --- Where admin + gfx get built ---
# Default: on the control node. A dev laptop has the toolchain, the warm pnpm
# store and the cores; a 2-vCPU VM has none of the three, and a Nuxt build is
# the single heaviest thing in this role. Building locally also means the VM
# never needs a node toolchain, a pnpm store or an nm-cache at all — only the
# finished `.output/public/` tree gets rsynced over.
#
# Opt out per-run by adding the `remote_build` tag to a deploy, which puts the
# builds back into throwaway node:24-slim containers on the target host:
#
#   ansible-playbook ... --tags csc,remote_build
#
# The extra tag only flips this switch — `csc` (or a sub-tag) is still what
# selects the tasks. `-e csc__build_remote=true` does the same without tags,
# and is the right form for a host that should *always* build remotely.
#
# This only covers the two Nuxt bundles. The api / otd / dmr5g-mirror docker
# images are still built on the target: they are linux/amd64, and emulating
# that on an arm64 laptop plus shipping the layers over ssh is slower than
# letting the VM build them natively.
csc__build_remote: "{{ 'remote_build' in ansible_run_tags }}"

# Control-node build only. `pnpm --filter ./<app> build` runs from
# `csc__source_dir`, so the checkout's own node_modules are what gets used.
csc__pnpm_bin: pnpm

# Native PostgreSQL (apt install postgresql-16 on the VM)
csc__pg_version: 16
csc__db_port: 5432

# API tuning
# MUST stay 1: the API is single-process by design — its SSE fan-out,
# admin invalidation bus, and background OResults pollers/replay ticker are
# in-memory per-process singletons. >1 worker forks non-shared-memory
# processes, silently dropping gfx SSE frames and double-running pollers.
# Scaling out requires a broker (Redis / Postgres LISTEN-NOTIFY) + a single
# leader for background tasks. See co-stream-control ADR-023.
csc__api_workers: 1
csc__log_level: INFO

# ADR-046 heightmap cache — the ``course_route_choices_3d`` gfx generates
# a 512×512 16-bit PNG per (event, group, dem_source, bbox) tuple, cached
# on disk. Backed by a named docker volume so re-fires after api container
# restarts don't rebuild from the DEM.
csc__heightmap_cache_dir: /var/lib/csc/heightmap

# --- DMR 5G stack (ADR-044 + ADR-046) ---
# self-hosted OpenTopoData instance serving the DMR 5G raster + a
# tile-mirror sidecar that walks the CUZK CDN. When these are enabled
# (default), CZE events get ~0.18 m RMSE elevations; when disabled,
# the api's DemSource cascade silently falls through to Copernicus
# GLO-30 (~4 m RMSE) — the deployment still works, just less accurate.
csc__dmr5g_enabled: true
# 127.0.0.1 bind for the OTD container. Only reached by the api
# container over the docker bridge (``http://otd:5000/v1``); the bind
# is exposed on loopback so an operator can also curl it for debug.
csc__otd_port: 5001
# Parallel HTTP fetches the dmr5g-mirror opens against the CUZK CDN.
# Bump if the CDN is happy with more; drop if the CDN rate-limits.
csc__dmr5g_concurrency: 5
