- name: Ensure {{ csc__gfx_dist }} exists
  ansible.builtin.file:
    path: "{{ csc__gfx_dist }}"
    state: directory

# Both branches fire async (poll:0) and register `csc_gfx_build_job`, so
# wait_builds.yml waits on one variable either way. See install.yml for why
# these are includes rather than imports.
- name: Build gfx SPA on the control node
  ansible.builtin.include_tasks: build_gfx_local.yml
  when: not csc__build_remote | bool

- name: Build gfx SPA on the target host
  ansible.builtin.include_tasks: build_gfx_remote.yml
  when: csc__build_remote | bool
