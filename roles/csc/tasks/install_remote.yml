- name: Ensure pnpm store and node_modules cache dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ csc__home_dir }}/pnpm-store"
    - "{{ csc__home_dir }}/nm-cache/root"
    - "{{ csc__home_dir }}/nm-cache/admin"
    - "{{ csc__home_dir }}/nm-cache/gfx"
    - "{{ csc__home_dir }}/nm-cache/shared"

# Only reached under `remote_build` (see defaults/main.yml). One `pnpm install`
# populates every workspace member's node_modules and the pnpm content-addressed
# store on the target. build_{admin,gfx}_remote.yml assume this ran first, so
# they can skip apt (native modules already compiled and living in nm-cache/**)
# and go straight to their build script.
- name: Install workspace deps (throwaway node container)
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ csc__home_dir }}/src:/build"
      - -v
      - "{{ csc__home_dir }}/pnpm-store:/pnpm-store"
      - -v
      - "{{ csc__home_dir }}/nm-cache/root:/build/node_modules"
      - -v
      - "{{ csc__home_dir }}/nm-cache/admin:/build/admin/node_modules"
      - -v
      - "{{ csc__home_dir }}/nm-cache/gfx:/build/gfx/node_modules"
      - -v
      - "{{ csc__home_dir }}/nm-cache/shared:/build/packages/shared/node_modules"
      - -w
      - /build
      - node:24-slim
      - bash
      - -euxc
      - |
        apt-get update -qq
        apt-get install -y --no-install-recommends -qq python3 make g++ ca-certificates
        corepack enable
        pnpm config set store-dir /pnpm-store

        # nm-cache/** deliberately survives between deploys, so this install
        # mutates a tree that was linked from an *older* pnpm-lock.yaml. That
        # reuse is what makes redeploys fast, and it is also the one way this
        # step fails: co-stream-control/.npmrc sets `node-linker=hoisted`, so
        # the tree is flat and a package's install script resolves its siblings
        # by plain node resolution — version-blind. When a dep is bumped, an
        # install script can therefore still see the copy it is replacing.
        # esbuild does exactly that (it execs @esbuild/<platform>/bin/esbuild
        # and asserts the reported version equals its own) and hard-fails with
        # `Expected "0.28.2" but got "0.28.1"`.
        #
        # Recover by emptying the caches and installing from scratch. The pnpm
        # store is left alone, so the retry is mostly hardlinks plus the native
        # rebuilds. node_modules are bind-mount points and cannot be removed
        # from inside the container, so clear them in place.
        pnpm install --frozen-lockfile || {
          echo "pnpm install failed against the reused nm-cache; retrying from a clean tree"
          for nm in node_modules admin/node_modules gfx/node_modules packages/shared/node_modules; do
            find "$nm" -mindepth 1 -delete
          done
          pnpm install --frozen-lockfile
        }
  changed_when: true
