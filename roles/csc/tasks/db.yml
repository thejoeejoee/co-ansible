- name: Create csc PostgreSQL role
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ credentials.csc_db.user }}"
    password: "{{ credentials.csc_db.pass }}"
    role_attr_flags: LOGIN
    state: present

- name: Create csc database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ credentials.csc_db.name }}"
    owner: "{{ credentials.csc_db.user }}"
    encoding: UTF-8
    lc_collate: C.UTF-8
    lc_ctype: C.UTF-8
    template: template0
    state: present
