# Dispatcher: workspace deps land wherever the bundles get built.
#
# `include_tasks` (not import) is deliberate — a skipped include never runs the
# tasks inside it, so the branch that loses can't clobber the registers set by
# the branch that won.
- name: Install workspace deps on the control node
  ansible.builtin.include_tasks: install_local.yml
  when: not csc__build_remote | bool

- name: Install workspace deps on the target host
  ansible.builtin.include_tasks: install_remote.yml
  when: csc__build_remote | bool
