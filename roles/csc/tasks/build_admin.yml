- name: Ensure {{ csc__admin_dist }} exists
  ansible.builtin.file:
    path: "{{ csc__admin_dist }}"
    state: directory

# Both branches fire async (poll:0) and register `csc_admin_build_job`, so
# wait_builds.yml waits on one variable either way. See install.yml for why
# these are includes rather than imports.
- name: Build admin SPA on the control node
  ansible.builtin.include_tasks: build_admin_local.yml
  when: not csc__build_remote | bool

- name: Build admin SPA on the target host
  ansible.builtin.include_tasks: build_admin_remote.yml
  when: csc__build_remote | bool
