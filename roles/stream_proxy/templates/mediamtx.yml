logLevel: info

writeQueueSize: 1024
udpReadBufferSize: 4000000

# upstream feeds
rtmp: yes
rtmpAddress: 0.0.0.0:1935

# previews/debugs
# hls: yes
# hlsAddress: localhost:8888

# previews/debugs
webrtc: true
webrtcAddress: localhost:8889
webrtcLocalUDPAddress: 0.0.0.0:8189

# downstream feeds
srt: true
srtAddress: 0.0.0.0:8890

srtla: yes
srtlaAddress: 0.0.0.0:8891

# Media-over-QUIC (browser publish/read via WebTransport)
moq: true
moqHTTP2Address: 0.0.0.0:8892
moqHTTP3Address: 0.0.0.0:8892
{% if web_proxy__disable_tls | default(false) %}
moqServerKey: auto.key
moqServerCert: auto.crt
{% else %}
moqServerKey: /home/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ web_proxy__domain }}/{{ web_proxy__domain }}.key
moqServerCert: /home/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ web_proxy__domain }}/{{ web_proxy__domain }}.crt
{% endif %}

# if needed, check all the needed ports with ufw
rtsp: yes
rtspAddress: localhost:8554

metrics: yes
metricsAddress: localhost:9998

pathDefaults:
  # alwaysAvailable: true
  # alwaysAvailableFile: /etc/mediamtx/co-stream-proxy-no-signal.mp4
  runOnReady: >
    bash -c '
    sleep $((RANDOM % 10));
    while true; do
      mkdir -p $(dirname /var/mediamtx/snapshots/$MTX_PATH.jpg);
      ffmpeg -y -rtsp_transport tcp -i rtsp://localhost:8554/$MTX_PATH -frames:v 1 -update 1 -vf scale=480:-1 -q:v 8 /var/mediamtx/snapshots/$MTX_PATH.jpg 2>/dev/null;
      sleep 30;
    done'
  runOnReadyRestart: yes

paths:

  macos: {}
  x/macos: {}

  slot1: {}
  x/slot1: {}
  slot2: {}
  x/slot2: {}
  slot3: {}
  x/slot3: {}
  slot4: {}
  x/slot4: {}
  slot5: {}
  x/slot5: {}
  slot6: {}
  x/slot6: {}
  slot7: {}
  x/slot7: {}
  slot8: {}
  x/slot8: {}

  demo: {}
  x/demo: {}

  # restreaming to YouTube/Facebook (keys loaded from /etc/mediamtx/restream.env)
  restream:
    alwaysAvailable: false
    runOnReady: /etc/mediamtx/restream.sh
    runOnReadyRestart: yes

authInternalUsers:
{% for cred in credentials.stream_write %}
- user: "{{ cred.user }}"
  pass: "{{ cred.pass }}"
  permissions:
  - action: publish
  - action: read

{% endfor %}
{% for cred in credentials.stream_read %}
- user: "{{ cred.user }}"
  pass: "{{ cred.pass }}"
  permissions:
  - action: read

{% endfor %}
{% for cred in credentials.restream.write %}
- user: "{{ cred.user }}"
  pass: "{{ cred.pass }}"
  permissions:
  - action: publish
    path: restream
  - action: read
    path: restream

{% endfor %}
- user: any
  pass:
  ips: ['127.0.0.1', '::1']
  permissions:
  - action: api
  - action: metrics
  - action: pprof
  - action: publish
  - action: read
