# Kernel and network tuning for RTMP/SRT/mediamtx streaming performance.
# Applied via /etc/sysctl.d/ and kernel module loading.

- name: Load tcp_bbr kernel module
  become: true
  modprobe:
    name: tcp_bbr
    state: present

- name: Persist tcp_bbr module on boot
  become: true
  copy:
    content: "tcp_bbr\n"
    dest: /etc/modules-load.d/tcp_bbr.conf
    mode: '0644'

- name: Apply streaming network sysctl tuning
  become: true
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-streaming.conf
    reload: true
  loop: "{{ stream_proxy__sysctl_params | dict2items }}"
  vars:
    stream_proxy__sysctl_params:
      # --- TCP/UDP Buffers (32MB ceiling for SRT, conservative for 3.8GB RAM) ---
      net.core.rmem_max: "33554432"
      net.core.wmem_max: "33554432"
      net.core.rmem_default: "2097152"
      net.core.wmem_default: "2097152"
      net.ipv4.tcp_rmem: "4096 87380 33554432"
      net.ipv4.tcp_wmem: "4096 65536 33554432"
      net.ipv4.tcp_moderate_rcvbuf: "1"
      net.ipv4.udp_rmem_min: "131072"
      net.ipv4.udp_wmem_min: "131072"
      # --- SRT/UDP Performance ---
      # SRT uses ancillary control messages; default optmem_max (~20KB) is tight
      net.core.optmem_max: "524288"
      # Process more UDP packets per NAPI cycle (default 300 too low for burst)
      net.core.netdev_budget: "600"
      net.core.netdev_budget_usecs: "8000"
      # Low-latency UDP receive via busy-polling (µs spent polling before sleep)
      net.core.busy_read: "50"
      net.core.busy_poll: "50"
      # --- BBR Congestion Control (TCP/HLS delivery) ---
      net.core.default_qdisc: fq
      net.ipv4.tcp_congestion_control: bbr
      # --- Connection Handling ---
      net.core.somaxconn: "65535"
      net.core.netdev_max_backlog: "16384"
      net.ipv4.tcp_max_syn_backlog: "4096"
      net.ipv4.tcp_fin_timeout: "15"
      net.ipv4.tcp_slow_start_after_idle: "0"
      net.ipv4.tcp_mtu_probing: "1"
      net.ipv4.tcp_no_metrics_save: "1"
      # --- Keepalive (detect dead RTMP connections faster) ---
      net.ipv4.tcp_keepalive_time: "60"
      net.ipv4.tcp_keepalive_intvl: "10"
      net.ipv4.tcp_keepalive_probes: "6"
      # --- Conntrack (Docker loads nf_conntrack; many SRTLA UDP flows) ---
      net.netfilter.nf_conntrack_max: "262144"
      net.netfilter.nf_conntrack_udp_timeout_stream: "60"

- name: Deploy disable-thp systemd unit
  become: true
  copy:
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled && echo never > /sys/kernel/mm/transparent_hugepage/defrag'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/disable-thp.service
    mode: '0644'

- name: Enable and start disable-thp service
  become: true
  systemd:
    name: disable-thp.service
    enabled: true
    state: started
    daemon_reload: true
