- name: Apply kernel/network tuning for streaming
  ansible.builtin.include_tasks: tuning.yml

- name: Clone mediamtx fork
  delegate_to: localhost
  ansible.builtin.git:
    repo: "{{ stream_proxy__mediamtx_repo }}"
    dest: /tmp/mediamtx-src
    version: "{{ stream_proxy__mediamtx_commit }}"
    depth: 1
    force: true
  register: mediamtx_clone

- name: Generate mediamtx embedded assets
  delegate_to: localhost
  ansible.builtin.command:
    cmd: go generate ./...
    chdir: /tmp/mediamtx-src
  when: mediamtx_clone.changed

- name: Build mediamtx from fork (local cross-compile)
  delegate_to: localhost
  environment:
    GOOS: linux
    GOARCH: amd64
    CGO_ENABLED: '0'
  ansible.builtin.command:
    cmd: go build -ldflags '-s -w' -o /tmp/mediamtx-linux-amd64 .
    chdir: /tmp/mediamtx-src
  when: mediamtx_clone.changed

- name: Install mediamtx
  become: true
  ansible.builtin.copy:
    src: /tmp/mediamtx-linux-amd64
    dest: /usr/local/bin/mediamtx
    mode: '0755'
  notify: Restart mediamtx


- name: UFW allow RTMP
  become: true
  ufw:
    rule: allow
    port: 1935
    proto: tcp

- name: UFW allow SRT
  become: true
  ufw:
    rule: allow
    port: 8890
    proto: udp

- name: UFW allow SRTLA
  become: true
  ufw:
    rule: allow
    port: 8891
    proto: udp

- name: UFW allow WebRTC UDP
  become: true
  ufw:
    rule: allow
    port: 8189
    proto: udp

- name: UFW allow WebRTC
  become: true
  ufw:
    rule: allow
    port: 8889
    proto: tcp

- name: Prepare mediamtx config directory
  become: true
  file:
    path: /etc/mediamtx
    state: directory

- name: Clean snapshot directory
  become: true
  file:
    path: /var/mediamtx/snapshots
    state: absent

- name: Prepare snapshot directory
  become: true
  file:
    path: /var/mediamtx/snapshots
    state: directory

- name: Prepare config
  become: true
  template:
    src: mediamtx.yml
    dest: /etc/mediamtx/mediamtx.yml
    mode: '0644'

- name: Deploy restream env file
  become: true
  template:
    src: restream.env.j2
    dest: /etc/mediamtx/restream.env
    mode: '0600'

- name: Deploy restream script
  become: true
  copy:
    src: ../templates/restream.sh
    dest: /etc/mediamtx/restream.sh
    mode: '0755'

- name: Prepare offline segment video
  become: true
  copy:
    src: ../resources/co-stream-proxy-no-signal.mp4
    dest: /etc/mediamtx/co-stream-proxy-no-signal.mp4
    mode: '0644'

- name: Mediamtx systemd service is prepared
  become: true
  template:
    src: mediamtx.service
    dest: /usr/lib/systemd/system/csos-mediamtx.service

- name: Mediamtx systemd service is reloaded
  become: true
  systemd:
    daemon_reload: true

- name: Mediamtx systemd service is enabled
  become: true
  systemd:
    name: csos-mediamtx.service
    enabled: true
    state: started
