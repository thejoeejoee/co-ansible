# Runs on every deploy (not just the first one) — this is what makes
# defaults/main.yml's auth__org/groups/providers/applications actual
# infrastructure as code: edit the data, re-run the playbook, Casdoor
# converges to match. _ensure_object.yml does a plain "GET by id, create if
# missing, update if it already exists and the call site opts in" upsert.

- name: Wait for Casdoor to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/health"
    status_code: 200
  register: _casdoor_ready
  until: _casdoor_ready.status == 200
  retries: 30
  delay: 10

- name: Log in with the configured admin password
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/login"
    method: POST
    body_format: json
    body:
      username: admin
      password: "{{ auth__admin_pass }}"
      organization: built-in
      application: app-built-in
      autoSignin: false
      type: login
    status_code: [200, 400, 401]
  register: _casdoor_login_configured
  no_log: true

# Only reached on the very first deploy, before the password below has ever
# been rotated away from Casdoor's well-known factory default.
- name: Log in with Casdoor's default admin password (first run only)
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/login"
    method: POST
    body_format: json
    body:
      username: admin
      password: "123"
      organization: built-in
      application: app-built-in
      autoSignin: false
      type: login
    status_code: [200, 400, 401]
  register: _casdoor_login_default
  when: _casdoor_login_configured.json.status != "ok"
  no_log: true

- name: Fail when neither the configured nor the default admin password works
  ansible.builtin.assert:
    that:
      - _casdoor_login_configured.json.status == "ok" or (_casdoor_login_default.json is defined and _casdoor_login_default.json.status == "ok")
    fail_msg: Could not authenticate to Casdoor as built-in/admin with either the configured or the default password

- name: Set session cookie
  ansible.builtin.set_fact:
    _casdoor_cookie: >-
      {{ _casdoor_login_configured.cookies_string
         if _casdoor_login_configured.json.status == "ok"
         else _casdoor_login_default.cookies_string }}
  no_log: true

- name: Rotate default admin password to the configured value (first run only)
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/set-password"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: form-urlencoded
    body:
      userOwner: built-in
      userName: admin
      oldPassword: "123"
      newPassword: "{{ auth__admin_pass }}"
    status_code: 200
  when: _casdoor_login_configured.json.status != "ok"
  no_log: true

- name: Ensure {{ auth__org }} organization exists and matches config
  ansible.builtin.include_tasks: _ensure_object.yml
  vars:
    _ensure_label: "{{ auth__org }} organization"
    _ensure_get_path: "/api/get-organization?id=admin/{{ auth__org }}"
    _ensure_add_path: /api/add-organization
    _ensure_update_path: "/api/update-organization?id=admin/{{ auth__org }}"
    _ensure_body:
      owner: admin
      name: "{{ auth__org }}"
      displayName: "{{ auth__org_display_name }}"
      websiteUrl: "https://{{ web_proxy__domain }}"
      passwordType: bcrypt
      defaultTokenFormat: JWT
      enableSoftDeletion: false
      isProfilePublic: false
      themeData:
        themeType: default
        colorPrimary: "{{ auth__theme.color_primary }}"
        borderRadius: "{{ auth__theme.border_radius }}"
        isCompact: false
        isEnabled: true

# Create-only, deliberately never updated: rotating the JWT signing cert
# would invalidate every token issued so far (every logged-in session,
# every downstream app's stored id_token).
- name: Ensure cert-{{ auth__org }} JWT signing certificate exists
  ansible.builtin.include_tasks: _ensure_object.yml
  vars:
    _ensure_label: "cert-{{ auth__org }} certificate"
    _ensure_get_path: "/api/get-cert?id=admin/cert-{{ auth__org }}"
    _ensure_add_path: /api/add-cert
    _ensure_body:
      owner: admin
      name: "cert-{{ auth__org }}"
      displayName: "{{ auth__org_display_name }} JWT Cert"
      scope: JWT
      type: x509
      cryptoAlgorithm: RS256
      bitSize: 4096
      expireInYears: 20

# New users start in none of these — that's the default-deny requirement.
# An admin adds a user to one via the Casdoor Groups page after they sign up.
- name: Ensure groups exist and match config
  ansible.builtin.include_tasks: _ensure_object.yml
  vars:
    _ensure_label: "{{ auth__org }}/{{ item.name }} group"
    _ensure_get_path: "/api/get-group?id={{ auth__org }}/{{ item.name }}"
    _ensure_add_path: /api/add-group
    _ensure_update_path: "/api/update-group?id={{ auth__org }}/{{ item.name }}"
    _ensure_body:
      owner: "{{ auth__org }}"
      name: "{{ item.name }}"
      displayName: "{{ item.display_name }}"
      type: Physical
      isTopGroup: true
  loop: "{{ auth__groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure identity providers exist and match config
  ansible.builtin.include_tasks: _ensure_object.yml
  vars:
    _ensure_label: "{{ item.name }} identity provider"
    _ensure_get_path: "/api/get-provider?id=admin/{{ item.name }}"
    _ensure_add_path: /api/add-provider
    _ensure_update_path: "/api/update-provider?id=admin/{{ item.name }}"
    _ensure_body:
      owner: admin
      name: "{{ item.name }}"
      category: OAuth
      type: "{{ item.type }}"
      clientId: "{{ item.client_id }}"
      clientSecret: "{{ item.client_secret }}"
  loop: "{{ auth__providers }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# Attached to every application below with signupGroup left empty, so a
# fresh OAuth sign-up lands with zero groups too (same default-deny as
# manually-created accounts used to get before password signup was removed).
- name: Compute shared provider attachments for applications
  ansible.builtin.set_fact:
    _auth_provider_items: >-
      {{ (_auth_provider_items | default([])) + [{
        'name': item.name,
        'canSignUp': true,
        'canSignIn': true,
        'canUnlink': true,
        'prompted': false,
        'signupGroup': '',
        'rule': 'None',
      }] }}
  loop: "{{ auth__providers }}"
  loop_control:
    label: "{{ item.name }}"

# enablePassword: false alone only hides the password field in Casdoor's own
# UI — the backend's Application.IsPasswordEnabled() (the check /api/login
# actually enforces) has a bug where it ignores a signinMethods entry's
# "Hide password" rule and returns true as soon as *any* entry named
# "Password" exists, regardless of that rule. The only way to make it
# return false is to also send signinMethods as a genuinely empty list, so
# it falls through to the (correct) enablePassword check instead — see
# https://github.com/casdoor/casdoor/blob/master/object/application_util.go
# (IsPasswordEnabled). Together with leaving enableSignUp true (needed for
# OAuth auto-registration) and each provider's canSignUp above, this makes
# Google/GitHub the only way to create or sign in to an account, enforced
# server-side and not just hidden in the UI.
#
# The update path is scoped to specific columns because Application also
# carries server-generated clientId/clientSecret that our declarative body
# doesn't know — a full-column update would blank them out and break
# oauth2-proxy/Grafana's already-configured OIDC clients.
- name: Ensure OIDC applications exist and match config (password disabled)
  ansible.builtin.include_tasks: _ensure_object.yml
  vars:
    _ensure_label: "{{ item.name }} application"
    _ensure_get_path: "/api/get-application?id=admin/{{ item.name }}"
    _ensure_add_path: /api/add-application
    _ensure_update_path: "/api/update-application?id=admin/{{ item.name }}"
    _ensure_update_columns:
      - displayName
      - organization
      - cert
      - enablePassword
      - signinMethods
      - enableSignUp
      - grantTypes
      - redirectUris
      - tokenFormat
      - expireInHours
      - providers
    _ensure_body:
      owner: admin
      name: "{{ item.name }}"
      displayName: "{{ item.name }}"
      organization: "{{ auth__org }}"
      cert: "cert-{{ auth__org }}"
      enablePassword: false
      signinMethods: []
      enableSignUp: true
      grantTypes: [authorization_code, refresh_token]
      redirectUris:
        - "{{ item.redirect_uri }}"
      tokenFormat: JWT
      expireInHours: 168
      providers: "{{ _auth_provider_items }}"
  loop: "{{ auth__applications }}"
  loop_control:
    label: "{{ item.name }}"

- name: Provision test users
  when: auth__provision_test_users | default(false)
  block:
    - name: Ensure test users exist, pre-assigned to their group
      ansible.builtin.include_tasks: _ensure_object.yml
      vars:
        _ensure_label: "{{ item.username }} test user"
        _ensure_get_path: "/api/get-user?id={{ auth__org }}/{{ item.username }}"
        _ensure_add_path: /api/add-user
        _ensure_body:
          owner: "{{ auth__org }}"
          name: "{{ item.username }}"
          password: "{{ item.password }}"
          email: "{{ item.username }}@{{ auth__org }}.local"
          groups:
            - "{{ auth__org }}/{{ item.group }}"
      loop:
        - { username: testadmin, group: admin, password: "Test12345!" }
        - { username: testdemo, group: demo, password: "Test12345!" }
      loop_control:
        label: "{{ item.username }}"
      no_log: true
  # NOTE: password login is disabled on the oauth2-proxy/grafana applications
  # above, so these test accounts can't actually sign in through the normal
  # flow anymore — they're only useful for verifying the bootstrap/group
  # plumbing itself. End-to-end login testing now needs real Google/GitHub
  # OAuth app credentials, even in local dev.

- name: Fetch oauth2-proxy application credentials
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-application?id=admin/oauth2-proxy"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _oauth2_proxy_app
  no_log: true

- name: Fetch grafana application credentials
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-application?id=admin/grafana"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _grafana_app
  no_log: true

- name: Set real oauth2-proxy and grafana client credentials
  ansible.builtin.set_fact:
    auth__oauth2_proxy_client_id: "{{ _oauth2_proxy_app.json.data.clientId }}"
    auth__oauth2_proxy_client_secret: "{{ _oauth2_proxy_app.json.data.clientSecret }}"
    auth__grafana_oidc_client_id: "{{ _grafana_app.json.data.clientId }}"
    auth__grafana_oidc_client_secret: "{{ _grafana_app.json.data.clientSecret }}"
  no_log: true

- name: Ensure local facts directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: '0755'
  become: true

- name: Persist auth credentials as local facts
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/auth_credentials.fact
    mode: '0644'
    content: |
      [oauth2_proxy]
      client_id={{ auth__oauth2_proxy_client_id }}
      client_secret={{ auth__oauth2_proxy_client_secret }}

      [grafana]
      client_id={{ auth__grafana_oidc_client_id }}
      client_secret={{ auth__grafana_oidc_client_secret }}
  become: true
  no_log: true

- name: Re-render oauth2-proxy config with real credentials
  ansible.builtin.template:
    src: oauth2-proxy.cfg.j2
    dest: "{{ auth__home_dir }}/oauth2-proxy.cfg"
    mode: '0644'
  become: true
  notify: Restart oauth2-proxy

- name: Flush handlers after reconcile
  ansible.builtin.meta: flush_handlers
