- name: Wait for Casdoor to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/health"
    status_code: 200
  register: _casdoor_ready
  until: _casdoor_ready.status == 200
  retries: 30
  delay: 10

- name: Try logging in with Casdoor's default admin password
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/login"
    method: POST
    body_format: json
    body:
      username: admin
      password: "123"
      organization: built-in
      application: app-built-in
      autoSignin: false
      type: login
    status_code: [200, 400, 401]
  register: _casdoor_login_default
  no_log: true

- name: Log in with the configured admin password
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/login"
    method: POST
    body_format: json
    body:
      username: admin
      password: "{{ auth__admin_pass }}"
      organization: built-in
      application: app-built-in
      autoSignin: false
      type: login
    status_code: [200, 400, 401]
  register: _casdoor_login_configured
  when: _casdoor_login_default.json.status != "ok"
  no_log: true

- name: Fail when neither the default nor the configured admin password works
  ansible.builtin.assert:
    that:
      - _casdoor_login_default.json.status == "ok" or (_casdoor_login_configured.json is defined and _casdoor_login_configured.json.status == "ok")
    fail_msg: Could not authenticate to Casdoor as built-in/admin with either the default or the configured password

- name: Set bootstrap session cookie
  ansible.builtin.set_fact:
    _casdoor_cookie: >-
      {{ _casdoor_login_default.cookies_string
         if _casdoor_login_default.json.status == "ok"
         else _casdoor_login_configured.cookies_string }}
  no_log: true

- name: Rotate default admin password to the configured value (first run only)
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/set-password"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: form-urlencoded
    body:
      userOwner: built-in
      userName: admin
      oldPassword: "123"
      newPassword: "{{ auth__admin_pass }}"
    status_code: 200
  when: _casdoor_login_default.json.status == "ok"
  no_log: true

- name: Check for existing {{ auth__org }} organization
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-organization?id=admin/{{ auth__org }}"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _org_check
  no_log: true

- name: Create {{ auth__org }} organization
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/add-organization"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: json
    body:
      owner: admin
      name: "{{ auth__org }}"
      displayName: "{{ auth__org_display_name }}"
      websiteUrl: "https://{{ web_proxy__domain }}"
      passwordType: bcrypt
      defaultTokenFormat: JWT
      enableSoftDeletion: false
      isProfilePublic: false
    status_code: 200
  when: _org_check.json.data is none
  no_log: true

- name: Check for existing cert-{{ auth__org }} certificate
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-cert?id=admin/cert-{{ auth__org }}"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _cert_check
  no_log: true

- name: Create JWT signing certificate
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/add-cert"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: json
    body:
      owner: admin
      name: "cert-{{ auth__org }}"
      displayName: "{{ auth__org_display_name }} JWT Cert"
      scope: JWT
      type: x509
      cryptoAlgorithm: RS256
      bitSize: 4096
      expireInYears: 20
    status_code: 200
  when: _cert_check.json.data is none
  no_log: true

- name: List existing groups in {{ auth__org }}
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-groups?owner={{ auth__org }}"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _groups_check
  no_log: true

- name: Create missing groups (new users start in none of these — default-deny)
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/add-group"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: json
    body:
      owner: "{{ auth__org }}"
      name: "{{ item.name }}"
      displayName: "{{ item.display_name }}"
      type: Physical
      isTopGroup: true
    status_code: 200
  loop: "{{ auth__groups }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in ((_groups_check.json.data | default([])) | map(attribute='name') | list)
  no_log: true

- name: Check for existing Google identity provider
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-provider?id=admin/google"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _google_provider_check
  no_log: true

- name: Create Google identity provider
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/add-provider"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: json
    body:
      owner: admin
      name: google
      category: OAuth
      type: Google
      clientId: "{{ auth__google_client_id }}"
      clientSecret: "{{ auth__google_client_secret }}"
    status_code: 200
  when: _google_provider_check.json.data is none
  no_log: true

# signupGroup is deliberately empty: Google sign-ups land with zero groups,
# same as manually-created accounts, until an admin assigns one via the
# Casdoor Groups page.
- name: Check for existing oauth2-proxy application
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-application?id=admin/oauth2-proxy"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _oauth2_proxy_app_check
  no_log: true

- name: Create oauth2-proxy application
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/add-application"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: json
    body:
      owner: admin
      name: oauth2-proxy
      displayName: oauth2-proxy
      organization: "{{ auth__org }}"
      cert: "cert-{{ auth__org }}"
      enablePassword: true
      enableSignUp: true
      grantTypes: [authorization_code, refresh_token]
      redirectUris:
        - "https://{{ web_proxy__domain }}/oauth2/callback"
      tokenFormat: JWT
      expireInHours: 168
      providers:
        - name: google
          canSignUp: true
          canSignIn: true
          canUnlink: true
          prompted: false
          signupGroup: ""
          rule: None
    status_code: 200
  when: _oauth2_proxy_app_check.json.data is none
  no_log: true

- name: Check for existing grafana application
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-application?id=admin/grafana"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _grafana_app_check
  no_log: true

- name: Create grafana application
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/add-application"
    method: POST
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    body_format: json
    body:
      owner: admin
      name: grafana
      displayName: grafana
      organization: "{{ auth__org }}"
      cert: "cert-{{ auth__org }}"
      enablePassword: true
      enableSignUp: true
      grantTypes: [authorization_code, refresh_token]
      redirectUris:
        - "https://{{ web_proxy__domain }}/grafana/login/generic_oauth"
      tokenFormat: JWT
      expireInHours: 168
      providers:
        - name: google
          canSignUp: true
          canSignIn: true
          canUnlink: true
          prompted: false
          signupGroup: ""
          rule: None
    status_code: 200
  when: _grafana_app_check.json.data is none
  no_log: true

- name: Provision test users
  when: auth__provision_test_users | default(false)
  no_log: true
  block:
    - name: Check for existing test users
      ansible.builtin.uri:
        url: "http://localhost:{{ auth__casdoor_port }}/api/get-user?id={{ auth__org }}/{{ item.username }}"
        headers:
          Cookie: "{{ _casdoor_cookie }}"
        status_code: 200
      register: _test_user_checks
      loop:
        - { username: testadmin, group: admin, password: "Test12345!" }
        - { username: testdemo, group: demo, password: "Test12345!" }
      loop_control:
        label: "{{ item.username }}"

    - name: Create missing test users, pre-assigned to their group
      ansible.builtin.uri:
        url: "http://localhost:{{ auth__casdoor_port }}/api/add-user"
        method: POST
        headers:
          Cookie: "{{ _casdoor_cookie }}"
        body_format: json
        body:
          owner: "{{ auth__org }}"
          name: "{{ item.item.username }}"
          password: "{{ item.item.password }}"
          email: "{{ item.item.username }}@{{ auth__org }}.local"
          groups:
            - "{{ auth__org }}/{{ item.item.group }}"
        status_code: 200
      loop: "{{ _test_user_checks.results }}"
      loop_control:
        label: "{{ item.item.username }}"
      when: item.json.data is none

- name: Fetch oauth2-proxy application credentials
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-application?id=admin/oauth2-proxy"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _oauth2_proxy_app
  no_log: true

- name: Fetch grafana application credentials
  ansible.builtin.uri:
    url: "http://localhost:{{ auth__casdoor_port }}/api/get-application?id=admin/grafana"
    headers:
      Cookie: "{{ _casdoor_cookie }}"
    status_code: 200
  register: _grafana_app
  no_log: true

- name: Set real oauth2-proxy and grafana client credentials
  ansible.builtin.set_fact:
    auth__oauth2_proxy_client_id: "{{ _oauth2_proxy_app.json.data.clientId }}"
    auth__oauth2_proxy_client_secret: "{{ _oauth2_proxy_app.json.data.clientSecret }}"
    auth__grafana_oidc_client_id: "{{ _grafana_app.json.data.clientId }}"
    auth__grafana_oidc_client_secret: "{{ _grafana_app.json.data.clientSecret }}"
  no_log: true

- name: Ensure local facts directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    mode: '0755'
  become: true

- name: Persist auth credentials as local facts
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/auth_credentials.fact
    mode: '0644'
    content: |
      [oauth2_proxy]
      client_id={{ auth__oauth2_proxy_client_id }}
      client_secret={{ auth__oauth2_proxy_client_secret }}

      [grafana]
      client_id={{ auth__grafana_oidc_client_id }}
      client_secret={{ auth__grafana_oidc_client_secret }}
  become: true
  no_log: true

- name: Re-render oauth2-proxy config with real credentials
  ansible.builtin.template:
    src: oauth2-proxy.cfg.j2
    dest: "{{ auth__home_dir }}/oauth2-proxy.cfg"
    mode: '0644'
  become: true
  notify: Restart oauth2-proxy

- name: Flush handlers after bootstrap
  ansible.builtin.meta: flush_handlers
