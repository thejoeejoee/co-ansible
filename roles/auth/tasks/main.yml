- name: Prepare {{ auth__home_dir }}/ directory
  ansible.builtin.file:
    path: "{{ auth__home_dir }}/"
    state: directory

- name: Prepare {{ auth__home_dir }}/bootstrap directory
  ansible.builtin.file:
    path: "{{ auth__home_dir }}/bootstrap"
    state: directory
    mode: '0777'

- name: Render docker-compose.yml to {{ auth__home_dir }}/docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ auth__home_dir }}/docker-compose.yml"

- name: Deploy Zitadel runtime config
  ansible.builtin.template:
    src: zitadel-config.yaml.j2
    dest: "{{ auth__home_dir }}/zitadel-config.yaml"
    mode: '0644'
  become: true

- name: Deploy Zitadel init steps
  ansible.builtin.template:
    src: zitadel-init-steps.yaml.j2
    dest: "{{ auth__home_dir }}/zitadel-init-steps.yaml"
    mode: '0644'
  become: true

- name: Load credentials from local facts (subsequent runs)
  ansible.builtin.set_fact:
    auth__oauth2_proxy_client_id: "{{ ansible_local.auth_credentials.oauth2_proxy.client_id }}"
    auth__oauth2_proxy_client_secret: "{{ ansible_local.auth_credentials.oauth2_proxy.client_secret }}"
    auth__grafana_oidc_client_id: "{{ ansible_local.auth_credentials.grafana.client_id }}"
    auth__grafana_oidc_client_secret: "{{ ansible_local.auth_credentials.grafana.client_secret }}"
  when: ansible_local.auth_credentials is defined
  no_log: true

- name: Render oauth2-proxy config
  ansible.builtin.template:
    src: oauth2-proxy.cfg.j2
    dest: "{{ auth__home_dir }}/oauth2-proxy.cfg"
    mode: '0644'
  become: true

- name: Create and start auth services
  community.docker.docker_compose_v2:
    project_src: "{{ auth__home_dir }}/"
    files:
      - docker-compose.yml
  become: true

- name: Bootstrap Zitadel (first run only)
  ansible.builtin.include_tasks: bootstrap.yml
  when: not (ansible_local.auth_credentials is defined)

- name: Prepare /var/www/credentials directory
  ansible.builtin.file:
    path: /var/www/credentials
    state: directory
    mode: '0755'
  become: true

- name: Deploy credentials dashboard
  ansible.builtin.template:
    src: credentials.html.j2
    dest: /var/www/credentials/index.html
    mode: '0644'
  become: true

- name: Prepare /var/www/demo directory
  ansible.builtin.file:
    path: /var/www/demo
    state: directory
    mode: '0755'
  become: true

- name: Deploy demo page
  ansible.builtin.template:
    src: demo.html.j2
    dest: /var/www/demo/index.html
    mode: '0644'
  become: true
