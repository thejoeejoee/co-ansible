- name: Apt update
  become: true
  apt:
    upgrade: yes
    update_cache: yes
    cache_valid_time: 86400

# Security review H2: remove the leftover cloud-init `ubuntu` account. It had
# `NOPASSWD:ALL` sudo (via /etc/sudoers.d/90-cloud-init-users) plus an
# authorized SSH key — a second, password-not-required, root-equivalent path.
# Legitimate access is via root/key-based login only.
- name: Remove leftover cloud-init ubuntu user
  become: true
  ansible.builtin.user:
    name: ubuntu
    state: absent
    remove: true
    force: true

- name: Remove cloud-init NOPASSWD sudoers drop-in
  become: true
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
- name: Install required packages
  become: true
  apt:
    name:
    - ffmpeg
    - ufw

- name: Install Docker
  block:
    - include_role:
        name: geerlingguy.docker
      vars:
        # Host-wide default so any container without its own `logging:`
        # override can't fill the disk (e.g. dmr5g-mirror hit 11G/week).
        docker_daemon_options:
          log-driver: json-file
          log-opts:
            max-size: "100m"
            max-file: "5"
          # Security review M1: pin the docker0 bridge address so the
          # host-gateway (what `host.docker.internal` resolves to) is a fixed
          # 172.17.0.1 across daemon restarts / upgrades / network recreation.
          # PostgreSQL is bound to exactly this address (roles/csc postgres.yml),
          # so the two must never drift. 172.17.0.1/16 is Docker's own default,
          # so pinning it here is a no-op on the current host — it just removes
          # the reliance on that default staying the default.
          bip: "172.17.0.1/16"
          host-gateway-ip: "172.17.0.1"
  become: true

- name: Shorten systemd-journald retention
  block:
    # Every non-docker service on this host (caddy, mediamtx, prometheus,
    # grafana, node_exporter, sshd, ...) logs to the journal, not a file —
    # cap it the same way the Docker log driver is capped above.
    - name: Ensure journald.conf.d directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Cap journald disk usage + retention
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/retention.conf
        content: |
          [Journal]
          SystemMaxUse=200M
          MaxRetentionSec=1week
        mode: "0644"
      register: _journald_conf

    - name: Restart systemd-journald to apply new limits
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
      when: _journald_conf.changed

    - name: Vacuum journal down to the new cap immediately
      ansible.builtin.command: journalctl --vacuum-size=200M
      changed_when: true
      when: _journald_conf.changed
  become: true

- name: Shorten default logrotate retention
  block:
    # Debian/Ubuntu's stock /etc/logrotate.conf defaults to `rotate 4`
    # (weekly) for any log under /etc/logrotate.d/* that doesn't set its
    # own count (syslog, auth.log, dpkg.log, ufw.log, ...). Tightening the
    # global default here doesn't touch files that already override
    # `rotate` themselves.
    - name: Reduce default rotate count
      ansible.builtin.lineinfile:
        path: /etc/logrotate.conf
        regexp: "^rotate\\s+\\d+"
        line: "rotate 2"

    - name: Cap individual log size regardless of schedule
      ansible.builtin.lineinfile:
        path: /etc/logrotate.conf
        regexp: "^#?\\s*maxsize"
        insertafter: "^rotate"
        line: "maxsize 50M"
  become: true
